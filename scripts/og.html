<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#07060B;color:#F3F1F8;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;right:-200px;top:-260px;width:900px;height:900px;background:radial-gradient(closest-side,rgba(108,92,231,.45),rgba(108,92,231,.08) 60%,transparent 75%)}
.in{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:22px}
.top svg{width:72px;height:78px}
.brand{font-size:44px;font-weight:700;letter-spacing:-1px}
.brand small{display:block;font-size:22px;font-weight:500;color:#ADA7BD;letter-spacing:0;margin-top:2px}
h1{font-size:68px;line-height:1.05;font-weight:700;letter-spacing:-2.4px;max-width:900px}
h1 em{font-style:normal;background:linear-gradient(135deg,#B6A3FF,#7D6EFF 60%,#6C5CE7);-webkit-background-clip:text;color:transparent}
.meta{display:flex;gap:14px}
.chip{padding:10px 18px;border:1.5px solid rgba(243,241,248,.22);border-radius:999px;font-size:22px;color:#ADA7BD;font-weight:500}
.chip b{display:inline-block;width:10px;height:10px;border-radius:50%;background:#34D399;margin-right:10px;vertical-align:middle}
</style></head><body><div class="glow"></div><div class="in">
<div class="top"><svg viewBox="0 0 24 26" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9D7FFA"/><stop offset=".5" stop-color="#7D6EFF"/><stop offset="1" stop-color="#5B4CD7"/></linearGradient></defs><g stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L16.5 8.5H7.5L12 3Z"/><path d="M12 8.5V16"/><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><circle cx="12" cy="21" r="2.5"/></g></svg>
<div class="brand">The Club<small>by Vighnir</small></div></div>
<h1>Friends, Minis and <em>one‑to‑one sessions</em> with people who know their stuff.</h1>
<div class="meta"><span class="chip">A social app for India</span><span class="chip">iPhone and Android</span><span class="chip"><b></b>In closed testing</span></div>
</div></body></html>
